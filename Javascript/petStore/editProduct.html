<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hug's Store - Editar producto</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="./editProduct.js" defer></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <header class="header">
      <a href="index.html" class="logo">Hug's Store</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="products.html">Productos</a></li>
          <li><a href="cart.html">Carrito</a></li>
          <li><a href="admin.html">Administración</a></li>
          <li>
            <button type="button" class="btn-login">Cerrar sesión</button>
          </li>
        </ul>
      </nav>
    </header>

    <main>
      <h1 class="edit-product-title">Editar producto</h1>

      <section class="edit-product-card">
        <p class="edit-form-warning">
          Por favor completa todos los campos antes de guardar los cambios.
        </p>

        <form class="edit-product-form" id="editProductForm">
          <div class="form-group">
            <label for="editProductName">Nombre</label>
            <input type="text" id="editProductName" />
          </div>

          <div class="form-group">
            <label for="editProductDescription">Descripción</label>
            <textarea id="editProductDescription" rows="4"></textarea>
          </div>

          <div class="form-group">
            <label for="editProductPrice">Precio</label>
            <input type="text" id="editProductPrice" />
          </div>

          <div class="form-group">
            <label for="editProductStock">Stock</label>
            <input type="text" id="editProductStock" />
          </div>

          <div class="edit-form-actions">
            <button
              type="button"
              class="btn-edit-cancel"
              onclick="window.location.href = 'admin.html'"
            >
              Cancelar
            </button>
            <button type="submit" class="btn-edit-submit">
              Guardar cambios
            </button>
          </div>
        </form>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Hug's Store. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
