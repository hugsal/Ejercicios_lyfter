<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hug's Store - Catálogo de productos</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="products.js" defer></script>
  </head>
  <body>
    <header class="header">
      <a href="index.html" class="logo">Hug's Store</a>
      <nav>
        <ul class="nav-links" id="userNavLinks">
          <li><a href="products.html">Productos</a></li>
          <li><a href="cart.html">Carrito</a></li>
          <li id="adminLink" class="hidden">
            <a href="admin.html">Administración</a>
          </li>
          <li>
            <button type="button" class="btn-login" id="log-out-btn">
              Cerrar sesión
            </button>
          </li>
        </ul>
      </nav>
    </header>
    <main>
      <h1 class="catalog-title">Catálogo de productos</h1>

      <section class="products-grid" id="productsGrid"></section>

      <!-- ESTADO VACÍO -->
      <section class="empty-state hidden" id="emptyState">
        <svg
          class="empty-icon"
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <circle cx="12" cy="12" r="10" />
          <path
            stroke-linecap="round"
            d="M9 10h.01M15 10h.01M16 16c-.8-1.2-2.1-2-4-2s-3.2.8-4 2"
          />
        </svg>
        <h3>No se encontraron productos</h3>
        <p>Intenta cambiar los filtros o la búsqueda.</p>
      </section>
    </main>

    <footer class="footer">
      <p>&copy; 2026 Hug's Store. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
