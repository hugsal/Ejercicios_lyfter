<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hug's Store - Iniciar Sesión</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <script src="constants.js"></script>
    <script src="axiosConfig.js"></script>
    <script src="auth.js"></script>
    <script src="apiServices.js"></script>
    <script src="login.js" defer></script>
  </head>
  <body>
    <header class="header">
      <a href="index.html" class="logo">Hug's Store</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="products.html">Productos</a></li>
          <li><a href="#">Contacto</a></li>
          <li><a href="login.html" class="btn-login">Iniciar sesión</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="form-container">
        <h2>Iniciar Sesión</h2>
        <form id="loginForm">
          <div class="form-group">
            <label for="userName">Usuario</label>
            <input
              type="text"
              id="userName"
              name="userName"
              placeholder="Ingresa tu usuario"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
            />
          </div>

          <button type="submit" class="btn-primary">Iniciar Sesión</button>
        </form>
        <div id="login-message" class="message"></div>

        <div class="form-footer">
          <p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
        </div>
      </div>
    </main>
    <footer class="footer">
      <p>&copy; 2026 Hug's Store. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
