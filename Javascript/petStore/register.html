<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hug's Store - Crear Cuenta</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="register.js" defer></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  </head>
  <body>
    <header class="header">
      <a href="index.html" class="logo">Hug's Store</a>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="products.html">Productos</a></li>
          <li><a href="#">Contacto</a></li>
          <li><a href="login.html" class="btn-login">Iniciar sesión</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="form-container">
        <h2>Crear Cuenta</h2>
        <form id="registerForm">
          <div class="form-group">
            <label for="name">Nombre</label>
            <input
              type="text"
              id="name"
              name="name"
              placeholder="Tu nombre"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Correo electrónico</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="ejemplo@correo.com"
              required
            />
          </div>

          <div class="form-group hidden" id="role-group">
            <label for="role">Rol</label>
            <select id="role" name="role">
              <option value="" disabled selected>Selecciona un rol</option>
              <option value="client">Usuario / Cliente</option>
              <option value="admin">Administrador</option>
            </select>
          </div>

          <div class="form-group">
            <label for="username">Nombre de usuario</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="usuario123"
              required
            />
          </div>

          <div class="form-group">
            <label for="password">Contraseña</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
            />
          </div>
          <div id="register-message" class="message"></div>

          <button type="submit" class="btn-primary">Registrarse</button>
        </form>

        <div class="form-footer">
          <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p>&copy; 2026 PawStore. Todos los derechos reservados.</p>
    </footer>
  </body>
</html>
